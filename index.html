<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Бичующий студент — Расширения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: #eee;
            padding: 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem 0;
        }

        .header h1 {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            background: linear-gradient(135deg, #ffd89b, #c7e9fb);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #a0a0c0;
        }

        .search-box {
            margin-top: 1.5rem;
        }

        .search-box input {
            width: 90%;
            max-width: 400px;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .filter-chip {
            background: rgba(255,255,255,0.08);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-chip.active {
            background: #ffd966;
            color: #1a1a2e;
            font-weight: bold;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .task-card {
            background: rgba(30, 30, 50, 0.7);
            border-radius: 20px;
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .task-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ffd966;
        }

        .task-desc {
            font-size: 0.85rem;
            color: #bcbcbc;
            margin-bottom: 0.8rem;
        }

        .buttons-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .ext-btn {
            background: #2c2c54;
            border: 1px solid #4a4a7a;
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .ext-btn::before {
            content: "🔌";
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #666;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎓 Бичующий студент</h1>
        <p>Расширения для браузера, чтобы учиться и гуглить как профи</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Искать расширение...">
        </div>
    </div>

    <div class="filters" id="filters">
        <span class="filter-chip active" data-cat="all">Все</span>
        <span class="filter-chip" data-cat="poisk">🔍 Поиск</span>
        <span class="filter-chip" data-cat="organizer">📚 Органайзер</span>
        <span class="filter-chip" data-cat="yazyki">🌍 Языки</span>
        <span class="filter-chip" data-cat="oflayn">📶 Офлайн</span>
        <span class="filter-chip" data-cat="privacy">🕵️ Приватность</span>
        <span class="filter-chip" data-cat="vkladki">🗂️ Вкладки</span>
        <span class="filter-chip" data-cat="academy">📖 Академия</span>
        <span class="filter-chip" data-cat="golos">🎙️ Голос</span>
    </div>

    <div class="tasks-grid" id="cardsGrid"></div>

    <div class="footer">
        🧠 Сделано бичующим студентом · Все расширения бесплатны
    </div>
</div>

<script>
    const extensions = [
        { name: "Search by Image", task: "Поиск по картинке", desc: "Найти источник фото", url: "https://chrome.google.com/webstore/detail/search-by-image", cat: "poisk" },
        { name: "Google Go", task: "Поиск по картинке", desc: "Облегчённый поиск", url: "https://play.google.com/store/apps/details?id=com.google.android.apps.searchngo", cat: "poisk" },
        { name: "Raindrop.io", task: "Закладки", desc: "Умное сохранение ссылок", url: "https://raindrop.io/", cat: "organizer" },
        { name: "OneTab", task: "Вкладки", desc: "Сворачивает вкладки в список", url: "https://chrome.google.com/webstore/detail/onetab", cat: "vkladki" },
        { name: "Fireshot", task: "Скриншоты", desc: "Скриншот всей страницы", url: "https://chrome.google.com/webstore/detail/fireshot", cat: "organizer" },
        { name: "Grammarly", task: "Английский", desc: "Проверка грамматики", url: "https://www.grammarly.com/", cat: "yazyki" },
        { name: "Copy as Markdown", task: "Цитирование", desc: "Копирует в Markdown", url: "https://chrome.google.com/webstore/detail/copy-as-markdown", cat: "academy" },
        { name: "Google Translate", task: "Перевод", desc: "Переводит сайты", url: "https://translate.google.com/", cat: "yazyki" },
        { name: "DuckDuckGo", task: "Приватность", desc: "Поиск без трекинга", url: "https://duckduckgo.com/", cat: "privacy" },
        { name: "uBlock Origin", task: "Блокировка рекламы", desc: "Чистит сайты", url: "https://chrome.google.com/webstore/detail/ublock-origin", cat: "privacy" },
        { name: "Tampermonkey", task: "Скрипты", desc: "Автоматизация сайтов", url: "https://www.tampermonkey.net/", cat: "vkladki" },
        { name: "Zotero", task: "Цитаты", desc: "Менеджер источников", url: "https://www.zotero.org/", cat: "academy" },
        { name: "Voice Access", task: "Голос", desc: "Управление голосом", url: "https://play.google.com/store/apps/details?id=com.google.android.apps.accessibility.voiceaccess", cat: "golos" }
    ];

    let currentFilter = "all";
    let currentSearch = "";

    function renderCards() {
        const grid = document.getElementById("cardsGrid");
        if (!grid) return;
        
        const filtered = extensions.filter(ext => {
            const matchFilter = currentFilter === "all" || ext.cat === currentFilter;
            const matchSearch = currentSearch === "" || ext.name.toLowerCase().includes(currentSearch.toLowerCase());
            return matchFilter && matchSearch;
        });
        
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="no-results">😕 Ничего не найдено</div>';
            return;
        }
        
        let html = "";
        filtered.forEach(ext => {
            html += `
                <div class="task-card">
                    <div class="task-title">${ext.task}</div>
                    <div class="task-desc">${ext.desc}</div>
                    <div class="buttons-group">
                        <a href="${ext.url}" target="_blank" class="ext-btn">${ext.name}</a>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }
    
    function init() {
        renderCards();
        
        document.getElementById("searchInput").addEventListener("input", (e) => {
            currentSearch = e.target.value;
            renderCards();
        });
        
        document.querySelectorAll(".filter-chip").forEach(chip => {
            chip.addEventListener("click", () => {
                document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
                chip.classList.add("active");
                currentFilter = chip.getAttribute("data-cat");
                renderCards();
            });
        });
    }
    
    init();
</script>
</body>
</html>
